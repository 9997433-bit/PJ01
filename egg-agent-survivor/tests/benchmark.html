<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Egg Agent Survivor — 敌人渲染基准</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #eaf2ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(340px, 1fr) auto;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 20% 0%, rgba(48, 105, 190, 0.24), transparent 42%),
        #07111f;
    }

    header,
    footer {
      padding: 14px clamp(14px, 3vw, 28px);
      background: rgba(8, 20, 36, 0.92);
      backdrop-filter: blur(14px);
    }

    header {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) auto;
      gap: 14px 24px;
      align-items: center;
      border-bottom: 1px solid rgba(139, 186, 255, 0.16);
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(17px, 2.4vw, 24px);
      letter-spacing: -0.02em;
    }

    .subtitle,
    .hint {
      margin: 0;
      color: #9fb2ca;
      font-size: 12px;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid rgba(144, 187, 248, 0.25);
      border-radius: 10px;
      background: #12243b;
      color: #dfeeff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover {
      border-color: #72b8ff;
      background: #17304e;
    }

    button:focus-visible {
      outline: 3px solid rgba(91, 187, 255, 0.48);
      outline-offset: 2px;
    }

    button[aria-pressed="true"],
    button.primary {
      border-color: #46c4ff;
      background: linear-gradient(135deg, #1166b7, #178aaf);
      color: white;
    }

    button.danger {
      border-color: rgba(255, 118, 137, 0.38);
      color: #ffc3cc;
    }

    main {
      position: relative;
      min-height: 340px;
      overflow: hidden;
      isolation: isolate;
    }

    #benchmark-canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 340px;
      touch-action: none;
      background: #091827;
    }

    .stats {
      position: absolute;
      z-index: 2;
      top: 14px;
      left: 14px;
      display: grid;
      grid-template-columns: repeat(5, minmax(76px, 1fr));
      gap: 8px;
      pointer-events: none;
    }

    .stat {
      min-width: 82px;
      padding: 9px 11px;
      border: 1px solid rgba(142, 190, 255, 0.17);
      border-radius: 11px;
      background: rgba(6, 15, 27, 0.78);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    .stat span {
      display: block;
      margin-bottom: 2px;
      color: #8da6c2;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat strong {
      display: block;
      color: #f2f8ff;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .status {
      position: absolute;
      z-index: 2;
      right: 14px;
      bottom: 14px;
      max-width: min(420px, calc(100% - 28px));
      padding: 9px 12px;
      border: 1px solid rgba(142, 190, 255, 0.18);
      border-radius: 10px;
      background: rgba(6, 15, 27, 0.8);
      color: #bdcde0;
      font-size: 12px;
      pointer-events: none;
    }

    .fps-chart-panel {
      position: absolute;
      z-index: 2;
      right: 14px;
      top: 14px;
      width: min(360px, calc(100% - 28px));
      padding: 8px 10px 10px;
      border: 1px solid rgba(142, 190, 255, 0.18);
      border-radius: 11px;
      background: rgba(6, 15, 27, 0.78);
      pointer-events: none;
    }

    .fps-chart-panel span {
      display: block;
      margin-bottom: 4px;
      color: #8da6c2;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #fps-chart {
      display: block;
      width: 100%;
      height: 82px;
    }

    footer {
      overflow-x: auto;
      border-top: 1px solid rgba(139, 186, 255, 0.16);
    }

    table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    th,
    td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(139, 186, 255, 0.1);
      text-align: right;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      color: #8fa7c3;
      font-weight: 600;
    }

    .empty {
      color: #7287a0;
      text-align: center !important;
    }

    @media (max-width: 720px) {
      header {
        grid-template-columns: 1fr;
      }

      .controls {
        justify-content: flex-start;
      }

      .stats {
        right: 10px;
        left: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .fps-chart-panel {
        top: auto;
        right: 10px;
        bottom: 48px;
        left: 10px;
        width: auto;
      }

      .stat {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>敌人渲染性能基准</h1>
      <p class="subtitle">独立 Canvas 2D 探针；不加载游戏资源或第三方依赖。</p>
    </div>
    <div class="controls" aria-label="基准控制">
      <button type="button" data-enemy-count="100" aria-pressed="true">100 敌人</button>
      <button type="button" data-enemy-count="300" aria-pressed="false">300 敌人</button>
      <button type="button" data-enemy-count="500" aria-pressed="false">500 敌人</button>
      <button type="button" class="primary" id="run-all">依次测试</button>
      <button type="button" class="danger" id="run-stress">500 敌人压测</button>
      <button type="button" class="danger" id="stop">停止采样</button>
      <button type="button" id="export-report" disabled>导出最终报告</button>
    </div>
  </header>

  <main id="arena">
    <canvas id="benchmark-canvas" aria-label="敌人渲染性能测试画布"></canvas>
    <section class="stats" aria-live="polite">
      <div class="stat"><span>实时 FPS</span><strong id="fps">--</strong></div>
      <div class="stat"><span>敌人数</span><strong id="enemy-count">100</strong></div>
      <div class="stat"><span>活跃粒子</span><strong id="particle-count">0</strong></div>
      <div class="stat"><span>P95 帧耗时</span><strong id="p95">--</strong></div>
      <div class="stat"><span>JS Heap</span><strong id="heap">N/A</strong></div>
    </section>
    <section class="fps-chart-panel" aria-label="FPS 历史图">
      <span>FPS 图表 · 目标线 60</span>
      <canvas id="fps-chart" width="680" height="164"></canvas>
    </section>
    <div class="status" id="status">持续渲染中。选择敌人数，或点击“依次测试”生成可比较结果。</div>
  </main>

  <footer>
    <table>
      <thead>
        <tr>
          <th>场景</th>
          <th>平均 FPS</th>
          <th>1% Low FPS</th>
          <th>P95 帧耗时</th>
          <th>卡顿帧 &gt; 50ms</th>
          <th>采样帧数</th>
          <th>粒子数</th>
          <th>画布像素</th>
        </tr>
      </thead>
      <tbody id="results">
        <tr><td class="empty" colspan="8">尚未运行完整采样</td></tr>
      </tbody>
    </table>
    <p class="hint">
      “500 敌人压测”额外叠加 3000 个批量粒子。自动测试默认预热 1.5 秒、每组采样 5 秒；后台标签页会暂停采样。
    </p>
  </footer>

  <script>
    (() => {
      'use strict';

      const COUNTS = [100, 300, 500];
      const params = new URLSearchParams(window.location.search);
      const WARMUP_MS = clampNumber(params.get('warmup'), 1500, 250, 10000);
      const SAMPLE_MS = clampNumber(params.get('duration'), 5000, 1000, 60000);
      const canvas = document.querySelector('#benchmark-canvas');
      const chartCanvas = document.querySelector('#fps-chart');
      const arena = document.querySelector('#arena');
      const context = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const chartContext = chartCanvas.getContext('2d', { alpha: false });
      const fpsOutput = document.querySelector('#fps');
      const countOutput = document.querySelector('#enemy-count');
      const particleOutput = document.querySelector('#particle-count');
      const p95Output = document.querySelector('#p95');
      const heapOutput = document.querySelector('#heap');
      const statusOutput = document.querySelector('#status');
      const resultsBody = document.querySelector('#results');
      const countButtons = [...document.querySelectorAll('[data-enemy-count]')];
      const exportButton = document.querySelector('#export-report');

      const state = {
        cssWidth: 1,
        cssHeight: 1,
        pixelRatio: 1,
        enemies: [],
        particles: [],
        enemyCount: 100,
        stressMode: false,
        lastFrameAt: 0,
        rollingFrameTimes: [],
        fpsHistory: [],
        lastChartAt: 0,
        sample: null,
        queue: [],
        results: [],
        completedAt: null,
        pointer: { x: 0, y: 0, active: false },
        random: createRandom(0x5eed1234),
      };

      function clampNumber(rawValue, fallback, minimum, maximum) {
        const parsed = Number(rawValue);
        return Number.isFinite(parsed)
          ? Math.min(maximum, Math.max(minimum, parsed))
          : fallback;
      }

      function createRandom(seed) {
        let value = seed >>> 0;
        return () => {
          value ^= value << 13;
          value ^= value >>> 17;
          value ^= value << 5;
          return (value >>> 0) / 4294967296;
        };
      }

      function resizeCanvas() {
        const bounds = arena.getBoundingClientRect();
        state.cssWidth = Math.max(1, Math.round(bounds.width));
        state.cssHeight = Math.max(1, Math.round(bounds.height));
        state.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(state.cssWidth * state.pixelRatio));
        canvas.height = Math.max(1, Math.round(state.cssHeight * state.pixelRatio));
        context.setTransform(
          state.pixelRatio,
          0,
          0,
          state.pixelRatio,
          0,
          0,
        );
        const chartBounds = chartCanvas.getBoundingClientRect();
        chartCanvas.width = Math.max(1, Math.round(chartBounds.width * state.pixelRatio));
        chartCanvas.height = Math.max(1, Math.round(chartBounds.height * state.pixelRatio));
        chartContext.setTransform(state.pixelRatio, 0, 0, state.pixelRatio, 0, 0);
      }

      function makeEnemy(index) {
        const radius = 4 + state.random() * 5;
        const angle = state.random() * Math.PI * 2;
        const speed = 18 + state.random() * 54;
        return {
          x: radius + state.random() * Math.max(1, state.cssWidth - radius * 2),
          y: radius + state.random() * Math.max(1, state.cssHeight - radius * 2),
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius,
          health: 0.2 + state.random() * 0.8,
          phase: state.random() * Math.PI * 2,
          elite: index % 25 === 0,
        };
      }

      function makeParticle(index) {
        return {
          x: state.random() * state.cssWidth,
          y: state.random() * state.cssHeight,
          radius: 0.7 + state.random() * 2.2,
          phase: state.random() * Math.PI * 2,
          color: index % 3,
        };
      }

      function setEnemyCount(count, preserveSampling = false, stressMode = false) {
        if (!COUNTS.includes(count)) {
          throw new RangeError(`Unsupported enemy count: ${count}`);
        }
        state.enemyCount = count;
        state.stressMode = stressMode;
        state.enemies = Array.from({ length: count }, (_, index) => makeEnemy(index));
        state.particles = stressMode
          ? Array.from({ length: 3000 }, (_, index) => makeParticle(index))
          : [];
        countOutput.textContent = String(count);
        particleOutput.textContent = String(state.particles.length);
        for (const button of countButtons) {
          button.setAttribute(
            'aria-pressed',
            String(Number(button.dataset.enemyCount) === count),
          );
        }
        if (!preserveSampling) {
          stopSampling(`持续渲染 ${count} 个敌人${stressMode ? ' + 3000 粒子' : ''}；自动采样未运行。`);
        }
      }

      function update(deltaSeconds, elapsedSeconds) {
        const pointerForce = state.pointer.active ? 32 : 0;

        for (const enemy of state.enemies) {
          if (pointerForce) {
            const dx = state.pointer.x - enemy.x;
            const dy = state.pointer.y - enemy.y;
            const distanceSquared = Math.max(100, dx * dx + dy * dy);
            const inverseDistance = 1 / Math.sqrt(distanceSquared);
            enemy.vx += dx * inverseDistance * pointerForce * deltaSeconds;
            enemy.vy += dy * inverseDistance * pointerForce * deltaSeconds;
          }

          enemy.x += enemy.vx * deltaSeconds;
          enemy.y += enemy.vy * deltaSeconds;

          if (enemy.x < enemy.radius) {
            enemy.x = enemy.radius;
            enemy.vx = Math.abs(enemy.vx);
          } else if (enemy.x > state.cssWidth - enemy.radius) {
            enemy.x = state.cssWidth - enemy.radius;
            enemy.vx = -Math.abs(enemy.vx);
          }

          if (enemy.y < enemy.radius) {
            enemy.y = enemy.radius;
            enemy.vy = Math.abs(enemy.vy);
          } else if (enemy.y > state.cssHeight - enemy.radius) {
            enemy.y = state.cssHeight - enemy.radius;
            enemy.vy = -Math.abs(enemy.vy);
          }

          enemy.health = 0.55 + Math.sin(elapsedSeconds * 1.8 + enemy.phase) * 0.4;
        }

        for (const particle of state.particles) {
          particle.phase += deltaSeconds * 1.7;
          particle.x += Math.cos(particle.phase) * deltaSeconds * 9;
          particle.y += Math.sin(particle.phase * 0.83) * deltaSeconds * 7;
          if (particle.x < 0) particle.x += state.cssWidth;
          else if (particle.x > state.cssWidth) particle.x -= state.cssWidth;
          if (particle.y < 0) particle.y += state.cssHeight;
          else if (particle.y > state.cssHeight) particle.y -= state.cssHeight;
        }
      }

      function draw() {
        const width = state.cssWidth;
        const height = state.cssHeight;
        context.fillStyle = '#091827';
        context.fillRect(0, 0, width, height);

        context.strokeStyle = 'rgba(88, 137, 180, 0.1)';
        context.lineWidth = 1;
        context.beginPath();
        for (let x = 0.5; x < width; x += 48) {
          context.moveTo(x, 0);
          context.lineTo(x, height);
        }
        for (let y = 0.5; y < height; y += 48) {
          context.moveTo(0, y);
          context.lineTo(width, y);
        }
        context.stroke();

        if (state.particles.length > 0) {
          const colors = ['#6fd8ff', '#ff7d9d', '#ffd45e'];
          context.save();
          context.globalCompositeOperation = 'lighter';
          context.globalAlpha = 0.55;
          for (let color = 0; color < colors.length; color++) {
            context.fillStyle = colors[color];
            context.beginPath();
            for (let i = color; i < state.particles.length; i += colors.length) {
              const particle = state.particles[i];
              context.moveTo(particle.x + particle.radius, particle.y);
              context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
            }
            context.fill();
          }
          context.restore();
        }

        for (const enemy of state.enemies) {
          if (enemy.elite) {
            context.beginPath();
            context.arc(enemy.x, enemy.y, enemy.radius + 3, 0, Math.PI * 2);
            context.fillStyle = 'rgba(255, 190, 68, 0.28)';
            context.fill();
          }

          const gradient = context.createRadialGradient(
            enemy.x - enemy.radius * 0.35,
            enemy.y - enemy.radius * 0.35,
            0,
            enemy.x,
            enemy.y,
            enemy.radius,
          );
          gradient.addColorStop(0, enemy.elite ? '#ffe18a' : '#ff9da8');
          gradient.addColorStop(1, enemy.elite ? '#f29b38' : '#d94b68');
          context.beginPath();
          context.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
          context.fillStyle = gradient;
          context.fill();

          const barWidth = enemy.radius * 2;
          const barY = enemy.y - enemy.radius - 4;
          context.fillStyle = 'rgba(3, 9, 15, 0.8)';
          context.fillRect(enemy.x - enemy.radius, barY, barWidth, 2);
          context.fillStyle = enemy.health > 0.35 ? '#65dfa0' : '#ff5f70';
          context.fillRect(
            enemy.x - enemy.radius,
            barY,
            barWidth * enemy.health,
            2,
          );
        }

        const playerX = state.pointer.active ? state.pointer.x : width / 2;
        const playerY = state.pointer.active ? state.pointer.y : height / 2;
        context.beginPath();
        context.arc(playerX, playerY, 11, 0, Math.PI * 2);
        context.fillStyle = '#67c9ff';
        context.fill();
        context.strokeStyle = 'rgba(179, 230, 255, 0.8)';
        context.lineWidth = 2;
        context.stroke();
      }

      function percentile(values, fraction) {
        if (values.length === 0) {
          return 0;
        }
        const sorted = [...values].sort((a, b) => a - b);
        const index = Math.min(
          sorted.length - 1,
          Math.ceil(sorted.length * fraction) - 1,
        );
        return sorted[Math.max(0, index)];
      }

      function updateLiveStats() {
        const times = state.rollingFrameTimes;
        if (times.length === 0) {
          return;
        }
        const total = times.reduce((sum, value) => sum + value, 0);
        const fps = 1000 * times.length / total;
        fpsOutput.textContent = Math.round(fps).toString();
        p95Output.textContent = `${percentile(times, 0.95).toFixed(1)} ms`;
        state.fpsHistory.push(fps);
        if (state.fpsHistory.length > 180) state.fpsHistory.shift();

        if (performance.memory) {
          heapOutput.textContent = `${
            (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(1)
          } MB`;
        }
      }

      function drawFpsChart() {
        const width = chartCanvas.width / state.pixelRatio;
        const height = chartCanvas.height / state.pixelRatio;
        chartContext.fillStyle = '#07111f';
        chartContext.fillRect(0, 0, width, height);

        chartContext.lineWidth = 1;
        chartContext.font = '10px ui-monospace, monospace';
        chartContext.textAlign = 'left';
        chartContext.textBaseline = 'bottom';
        for (const fps of [30, 60]) {
          const y = height - (fps / 75) * height;
          chartContext.strokeStyle = fps === 60
            ? 'rgba(101,223,160,0.62)'
            : 'rgba(255,212,94,0.28)';
          chartContext.beginPath();
          chartContext.moveTo(0, y + 0.5);
          chartContext.lineTo(width, y + 0.5);
          chartContext.stroke();
          chartContext.fillStyle = fps === 60 ? '#65dfa0' : '#a7b6c8';
          chartContext.fillText(String(fps), 4, y - 2);
        }

        if (state.fpsHistory.length < 2) return;
        chartContext.strokeStyle = '#72c7ff';
        chartContext.lineWidth = 2;
        chartContext.beginPath();
        for (let i = 0; i < state.fpsHistory.length; i++) {
          const x = (i / Math.max(1, state.fpsHistory.length - 1)) * width;
          const y = height - (Math.min(75, state.fpsHistory[i]) / 75) * height;
          if (i === 0) chartContext.moveTo(x, y);
          else chartContext.lineTo(x, y);
        }
        chartContext.stroke();
      }

      function beginScenario(scenario) {
        const count = typeof scenario === 'number' ? scenario : scenario.count;
        const stress = typeof scenario === 'object' && !!scenario.stress;
        setEnemyCount(count, true, stress);
        state.sample = {
          count,
          stress,
          phase: 'warmup',
          phaseStartedAt: performance.now(),
          frameTimes: [],
        };
        statusOutput.textContent = `${stress ? '500 敌人 + 3000 粒子压测' : `${count} 敌人`}：预热 ${(
          WARMUP_MS / 1000
        ).toFixed(1)} 秒…`;
      }

      function runAllScenarios() {
        state.results = [];
        state.completedAt = null;
        state.queue = COUNTS.map((count) => ({ count, stress: false }));
        document.body.dataset.benchmarkComplete = 'false';
        exportButton.disabled = true;
        renderResults();
        beginScenario(state.queue.shift());
      }

      function runStressScenario() {
        state.results = [];
        state.completedAt = null;
        state.queue = [{ count: 500, stress: true }];
        document.body.dataset.benchmarkComplete = 'false';
        exportButton.disabled = true;
        renderResults();
        beginScenario(state.queue.shift());
      }

      function stopSampling(message = '采样已停止；动画继续运行。') {
        state.queue = [];
        state.sample = null;
        statusOutput.textContent = message;
      }

      function advanceSample(timestamp, frameTime) {
        const sample = state.sample;
        if (!sample) {
          return;
        }

        const elapsed = timestamp - sample.phaseStartedAt;
        if (sample.phase === 'warmup') {
          if (elapsed >= WARMUP_MS) {
            sample.phase = 'measure';
            sample.phaseStartedAt = timestamp;
            sample.frameTimes = [];
            statusOutput.textContent = `${sample.stress ? '500 敌人 + 3000 粒子压测' : `${sample.count} 敌人`}：采样 ${(
              SAMPLE_MS / 1000
            ).toFixed(1)} 秒…`;
          }
          return;
        }

        if (frameTime > 0 && frameTime < 1000) {
          sample.frameTimes.push(frameTime);
        }

        if (elapsed < SAMPLE_MS) {
          return;
        }

        const totalTime = sample.frameTimes.reduce((sum, value) => sum + value, 0);
        const p95FrameTime = percentile(sample.frameTimes, 0.95);
        const p99FrameTime = percentile(sample.frameTimes, 0.99);
        state.results.push({
          count: sample.count,
          stress: sample.stress,
          averageFps: totalTime > 0
            ? 1000 * sample.frameTimes.length / totalTime
            : 0,
          lowFps: p99FrameTime > 0 ? 1000 / p99FrameTime : 0,
          p95FrameTime,
          longFrames: sample.frameTimes.filter((value) => value > 50).length,
          frames: sample.frameTimes.length,
          particles: state.particles.length,
          pixels: `${canvas.width}×${canvas.height}`,
        });
        renderResults();

        if (state.queue.length > 0) {
          beginScenario(state.queue.shift());
        } else {
          state.sample = null;
          state.completedAt = new Date().toISOString();
          window.__benchmarkResults = state.results.map((result) => ({ ...result }));
          document.body.dataset.benchmarkComplete = 'true';
          exportButton.disabled = false;
          statusOutput.textContent = sample.stress
            ? '500 敌人压测完成。FPS 图表保留最近 180 个采样点。'
            : '三组采样完成。比较结果时请保持相同窗口尺寸和设备状态。';
        }
      }

      /**
       * 生成可归档、可机读的最终压测报告。性能受设备影响，因此报告保留原始
       * 指标和目标线，不把单台机器的结果硬编码成跨设备的 PASS / FAIL。
       */
      function buildFinalReport() {
        const results = state.results.map((result) => ({ ...result }));
        const averageFpsValues = results.map((result) => result.averageFps);
        const p95Values = results.map((result) => result.p95FrameTime);
        return {
          schemaVersion: 1,
          modelSlug: 'gpt-5.6-sol-xhigh-fast',
          title: 'Egg Agent Survivor Round 3 最终压测报告',
          generatedAt: state.completedAt || new Date().toISOString(),
          complete: document.body.dataset.benchmarkComplete === 'true',
          environment: {
            userAgent: navigator.userAgent,
            viewport: `${state.cssWidth}×${state.cssHeight}`,
            canvasPixels: `${canvas.width}×${canvas.height}`,
            devicePixelRatio: state.pixelRatio,
            jsHeapBytes: performance.memory
              ? performance.memory.usedJSHeapSize
              : null,
          },
          configuration: {
            warmupMs: WARMUP_MS,
            sampleMs: SAMPLE_MS,
            targetFps: 60,
            longFrameThresholdMs: 50,
            enemyCounts: [...COUNTS],
            stressParticles: 3000,
          },
          summary: {
            scenarioCount: results.length,
            minimumAverageFps: results.length ? Math.min(...averageFpsValues) : null,
            maximumP95FrameTimeMs: results.length ? Math.max(...p95Values) : null,
            totalLongFrames: results.reduce(
              (total, result) => total + result.longFrames,
              0,
            ),
          },
          results,
        };
      }

      function downloadFinalReport() {
        if (state.results.length === 0) {
          statusOutput.textContent = '请先完成“依次测试”或“500 敌人压测”，再导出报告。';
          return false;
        }
        const report = buildFinalReport();
        const blob = new Blob(
          [`${JSON.stringify(report, null, 2)}\n`],
          { type: 'application/json;charset=utf-8' },
        );
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const stamp = report.generatedAt.replace(/[:.]/g, '-');
        link.href = url;
        link.download = `egg-agent-survivor-round3-benchmark-${stamp}.json`;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        statusOutput.textContent = `最终压测报告已导出（${report.summary.scenarioCount} 个场景）。`;
        return true;
      }

      function renderResults() {
        if (state.results.length === 0) {
          resultsBody.innerHTML = '<tr><td class="empty" colspan="8">等待采样结果…</td></tr>';
          return;
        }

        resultsBody.replaceChildren(...state.results.map((result) => {
          const row = document.createElement('tr');
          const values = [
            result.stress ? '500 敌人压测' : `${result.count} 敌人`,
            result.averageFps.toFixed(1),
            result.lowFps.toFixed(1),
            `${result.p95FrameTime.toFixed(1)} ms`,
            String(result.longFrames),
            String(result.frames),
            String(result.particles),
            result.pixels,
          ];
          for (const value of values) {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.append(cell);
          }
          return row;
        }));
      }

      function frame(timestamp) {
        const rawFrameTime = state.lastFrameAt ? timestamp - state.lastFrameAt : 0;
        state.lastFrameAt = timestamp;

        if (!document.hidden) {
          const deltaSeconds = Math.min(rawFrameTime / 1000, 0.05);
          update(deltaSeconds, timestamp / 1000);
          draw();

          if (rawFrameTime > 0 && rawFrameTime < 1000) {
            state.rollingFrameTimes.push(rawFrameTime);
            if (state.rollingFrameTimes.length > 120) {
              state.rollingFrameTimes.shift();
            }
          }
          advanceSample(timestamp, rawFrameTime);
          if (timestamp - state.lastChartAt >= 250) {
            state.lastChartAt = timestamp;
            updateLiveStats();
            drawFpsChart();
          }
        }

        requestAnimationFrame(frame);
      }

      function updatePointer(event) {
        const bounds = canvas.getBoundingClientRect();
        state.pointer.x = Math.min(
          state.cssWidth,
          Math.max(0, event.clientX - bounds.left),
        );
        state.pointer.y = Math.min(
          state.cssHeight,
          Math.max(0, event.clientY - bounds.top),
        );
        state.pointer.active = true;
      }

      for (const button of countButtons) {
        button.addEventListener('click', () => {
          setEnemyCount(Number(button.dataset.enemyCount));
        });
      }
      document.querySelector('#run-all').addEventListener('click', runAllScenarios);
      document.querySelector('#run-stress').addEventListener('click', runStressScenario);
      document.querySelector('#stop').addEventListener('click', () => stopSampling());
      exportButton.addEventListener('click', downloadFinalReport);
      canvas.addEventListener('pointerdown', (event) => {
        canvas.setPointerCapture(event.pointerId);
        updatePointer(event);
      });
      canvas.addEventListener('pointermove', (event) => {
        if (event.buttons !== 0 || event.pointerType === 'touch') {
          updatePointer(event);
        }
      });
      canvas.addEventListener('pointerup', (event) => {
        if (canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
        state.pointer.active = false;
      });
      canvas.addEventListener('pointercancel', () => {
        state.pointer.active = false;
      });
      document.addEventListener('visibilitychange', () => {
        state.lastFrameAt = 0;
        if (document.hidden && state.sample) {
          stopSampling('标签页进入后台，采样已取消以避免浏览器节流污染结果。');
        }
      });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          stopSampling();
        }
      });

      const resizeObserver = new ResizeObserver(resizeCanvas);
      resizeObserver.observe(arena);
      resizeCanvas();
      setEnemyCount(100);
      drawFpsChart();
      requestAnimationFrame(frame);

      window.__benchmark = {
        runAll: runAllScenarios,
        runStress: runStressScenario,
        stop: stopSampling,
        exportReport: buildFinalReport,
        downloadReport: downloadFinalReport,
      };
      if (params.get('stress') === '1') {
        runStressScenario();
      } else if (params.get('autorun') === '1') {
        runAllScenarios();
      }
    })();
  </script>
</body>
</html>
